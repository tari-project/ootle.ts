name: Lint
on:
  pull_request:
    branches:
      - main

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run lint
      # eslint is configured with eslint-config-prettier, so it deliberately ignores
      # formatting. Without this step nothing enforces it, and unformatted files
      # accumulate until someone's format-on-save produces an unrelated diff.
      - name: Check formatting (pnpm run format to fix)
        run: pnpm run format:check
      - run: pnpm run knip
