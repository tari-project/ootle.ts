---
# Publishing the workspace packages to the npm registry.
#
# Triggered by pushing a `v*` tag — NOT by merging to main. Merging a version bump
# only stages the release; publishing is a separate, deliberate act:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match the workspace version in the root package.json, and every
# packages/* manifest must inherit it (check_versions.sh). npm publishes are
# immutable, so both are verified before anything is pushed to the registry.
name: Publish Package to npmjs

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the workspace version
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION=$(node -p "require('./package.json').version")

          echo "Tag:               $GITHUB_REF_NAME (version $TAG_VERSION)"
          echo "Workspace version: $WORKSPACE_VERSION"

          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match the workspace version '$WORKSPACE_VERSION'."
            echo "Bump with 'pnpm version:set $TAG_VERSION' and re-tag, or tag 'v$WORKSPACE_VERSION' instead."
            exit 1
          fi

      # Every packages/* manifest must carry the workspace version; a mismatch would
      # publish a package at the wrong version, which npm will not let us take back.
      - run: ./scripts/check_versions.sh

      - run: pnpm -r build

      - name: Publish all modules to NPM
        run: |
          set -euo pipefail

          # Use the core SDK package as the version sentinel.
          # All workspace packages share the same version (enforced by check_versions.sh).
          SENTINEL="@tari-project/ootle"
          LOCAL_VERSION=$(node -p "require('./packages/ootle/package.json').version")

          echo "Sentinel package: $SENTINEL"
          echo "Local version:    $LOCAL_VERSION"

          REMOTE_VERSION=$(pnpm info "$SENTINEL" version 2>/dev/null || echo "NOT_FOUND")
          echo "Remote version:   $REMOTE_VERSION"

          if [ "$REMOTE_VERSION" = "$LOCAL_VERSION" ]; then
            echo "Version $LOCAL_VERSION already published, skipping."
            exit 0
          fi

          echo "== Publishing =="
          pnpm publish --provenance -r --no-git-checks
